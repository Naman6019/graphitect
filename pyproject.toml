[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graphitect"
version = "0.2.0"
description = "One self-contained codebase explainer: bundled Graphify analysis, bundled Archify diagrams, and optional LLM rationale."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-GRAPHIFY-APACHE-2.0", "LICENSE-GRAPHIFY-MIT", "NOTICE-GRAPHIFY", "LICENSE-ARCHIFY-MIT", "NOTICE-ARCHIFY-THIRD-PARTY.md"]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    # Graphify is bundled in this distribution. These are its runtime
    # libraries, installed by the same single `pip install graphitect` command.
    "networkx>=3.4",
    "numpy>=1.21",
    "rapidfuzz>=3.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "tree-sitter>=0.23.0,<0.26",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.25",
    "tree-sitter-go>=0.23,<0.26",
    "tree-sitter-rust>=0.23,<0.25",
    "tree-sitter-java>=0.23,<0.25",
    "tree-sitter-groovy>=0.1,<0.3",
    "tree-sitter-c>=0.23,<0.25",
    "tree-sitter-cpp>=0.23,<0.25",
    "tree-sitter-ruby>=0.23,<0.25",
    "tree-sitter-c-sharp>=0.23,<0.25",
    "tree-sitter-kotlin>=1.0,<2.0",
    "tree-sitter-scala>=0.23,<0.27",
    "tree-sitter-php>=0.23,<0.25",
    "tree-sitter-swift>=0.7,<0.9",
    "tree-sitter-lua>=0.2,<0.6",
    "tree-sitter-zig>=1.0,<2.0",
    "tree-sitter-powershell>=0.26,<0.28",
    "tree-sitter-elixir>=0.3,<0.5",
    "tree-sitter-objc>=3.0,<4.0",
    "tree-sitter-julia>=0.23,<0.25",
    "tree-sitter-verilog>=1.0,<2.0",
    "tree-sitter-fortran>=0.6,<0.8",
    "tree-sitter-bash>=0.23,<0.27",
    "tree-sitter-json>=0.23,<0.26",
    "tree-sitter-sql",
    # LLM providers are bundled into the one install; only a key is optional.
    "openai",
    "anthropic",
    "tiktoken",
]

[project.urls]
Homepage = "https://github.com/Naman6019/graphitect"
Repository = "https://github.com/Naman6019/graphitect"

[project.scripts]
graphitect = "graphitect.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
]

[tool.uv]
package = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["graphitect*", "graphify*"]

[tool.setuptools.package-data]
graphitect = ["skill/SKILL.md", "skill/agents/openai.yaml"]
graphify = [
    "skill*.md",
    "command-kilo.md",
    "skills/*/references/*.md",
    "always_on/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
