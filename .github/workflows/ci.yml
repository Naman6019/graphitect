name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install package and test tools
        run: python -m pip install . pytest ruff
      - name: Lint Graphitect and its tests
        run: python -m ruff check graphitect tests
      - name: Verify bundled Archify runtime
        run: node graphitect/_vendor/archify/bin/archify.mjs --help
      - name: Run tests
        run: python -m pytest

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build distribution artifacts
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel outside the checkout
        run: |
          mkdir -p /tmp/graphitect-wheel-smoke
          cd /tmp/graphitect-wheel-smoke
          python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          graphitect --help
          node "$GITHUB_WORKSPACE"/graphitect/_vendor/archify/bin/archify.mjs --help
